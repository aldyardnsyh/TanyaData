# TanyaData — production compose (VPS 2 vCPU / 2 GB RAM / 40 GB SSD).
#
# TIDAK dijalankan oleh agent. Operator yang menjalankan di VPS setelah
# `npm run build` + `npm run bootstrap:production` sukses. Lihat
# docs/PRODUCTION_READY.md (root repo) untuk urutan lengkap.
#
# Tiga service:
#   app    — Next standalone (.next/standalone), loopback :3000 di balik Caddy.
#   qdrant — v1.20.0, API key WAJIB, volume persisten, bind loopback :6333.
#   ocr    — tanyadata-ocr:1.0.0, build dari deploy/ocr, bind loopback :6334.
#            Berada di profile `ocr`: jalankan hanya saat ingestion butuh OCR
#            (`docker compose --profile ocr up -d`), lalu stop lagi.
#
# data/workspace dan data/seed adalah BIND MOUNT ke host agar
# `npm run bootstrap:production` (host) dan container melihat DB/file yang sama.
# Jangan mengganti ke named volume tanpa memindahkan bootstrap ke dalam container.

name: tanyadata-prod

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    image: tanyadata-app:1.0.0
    container_name: tanyadata-app
    restart: unless-stopped

    # Samakan UID/GID dengan user VPS pemilik data/workspace agar SQLite
    # bisa ditulis kedua belah pihak (host bootstrap + container).
    user: "${UID:-1000}:${GID:-1000}"

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Semua secret / konfigurasi lain dibaca dari .env.local di root app.
      # File itu TIDAK ikut ter-commit dan TIDAK disalin ke image.
      # Mount sebagai env-file (baris di bawah) — pastikan file ada di VPS.
    env_file:
      - ../../.env.local

    volumes:
      - ../../data/workspace:/app/data/workspace
      - ../../data/seed:/app/data/seed

    depends_on:
      - qdrant

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/meta').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: tanyadata-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"
      # 6334 (gRPC) sengaja TIDAK dipublish.

    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY wajib di .env VPS}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: INFO

    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          (curl -fsS -H "api-key: $$QDRANT__SERVICE__API_KEY" http://127.0.0.1:6333/readyz >/dev/null 2>&1
          || wget -q -O- --header="api-key: $$QDRANT__SERVICE__API_KEY" http://127.0.0.1:6333/readyz >/dev/null 2>&1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true

  ocr:
    build:
      context: ./ocr
      dockerfile: Dockerfile
    image: tanyadata-ocr:1.0.0
    container_name: tanyadata-ocr
    restart: unless-stopped

    # Opt-in: hanya saat ingestion butuh OCR. Tanpa profile, container ini
    # tidak ikut start pada `docker compose up -d` biasa.
    profiles:
      - ocr

    ports:
      - "127.0.0.1:6334:6334"

    environment:
      OCR_API_KEY: ${OCR_API_KEY:?OCR_API_KEY wajib di .env VPS}
      # 4.0 s terlalu ketat untuk 2 vCPU: PP-OCRv6 butuh >4 s pada halaman padat
      # → respons 504 dan halaman jatuh ke ocr_skipped. Default 60 s; bisa
      # diturunkan lewat var shell bila VPS lebih kuat.
      OCR_TIMEOUT_S: "${OCR_TIMEOUT_S:-60}"
      OCR_MAX_IMAGE_BYTES: "2097152"
      XDG_CACHE_HOME: /opt/ocr/.cache

    volumes:
      - ocr_model_cache:/opt/ocr/.cache

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6334/healthz', timeout=3).status==200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    mem_limit: ${OCR_MEM_LIMIT:-1g}
    cpus: ${OCR_CPUS:-1}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  qdrant_storage:
  qdrant_snapshots:
  ocr_model_cache:
