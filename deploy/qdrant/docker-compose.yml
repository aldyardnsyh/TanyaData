# Qdrant — satu node di VPS TanyaData (DECISION-032 / ADR-QD-02).
#
# KONSTRAIN VPS: 2 vCPU / 2 GB RAM / 40 GB SSD.
# - Image DI-PIN v1.20.0, berpasangan dengan @qdrant/js-client-rest@1.20.0.
#   Jangan pakai `latest`. Upgrade: snapshot dulu, cluster dulu, SDK kemudian.
# - Hanya loopback 127.0.0.1:6333. Port 6334 (gRPC) sengaja TIDAK dipublish.
# - API key WAJIB. TLS di-terminate reverse proxy (Caddy) yang sudah ada.
# - Named volume persisten. JANGAN bind-mount direktori Windows/WSL untuk data
#   (dokumentasi resmi memperingatkan risiko data loss).
#
# Agent tidak menjalankan file ini. Lihat README.md di folder yang sama.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: tanyadata-qdrant
    restart: unless-stopped

    ports:
      - "127.0.0.1:6333:6333"

    environment:
      # Rahasia — diisi dari secret manager / .env VPS. Jangan commit.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY wajib di .env VPS}
      # TLS ditangani Caddy di host; Qdrant hanya bicara loopback.
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: INFO

      # Opsi RAM 2 GB — HANYA set bila terukur perlu, sesuai dokumentasi
      # Qdrant Capacity Planning / Performance. Jangan mengarang nilai:
      # ukur dulu RSS Qdrant saat reindex, lalu tentukan ambang index-on-disk.
      # QDRANT__STORAGE__PERFORMANCE__INDEXING_THRESHOLD_GB: <nilai-terukur>

    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

    # Batasi RAM agar tidak berebut dengan Next.js + Chromium PDF di VPS 2 GB.
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M
    security_opt:
      - no-new-privileges:true

volumes:
  qdrant_storage:
  qdrant_snapshots:
